name: GPU E2E

# Runs tests/gpu on a real GPU through Modal. Manual, or on PRs labelled
# "run-gpu-tests" so normal pushes don't spend GPU credit.
# Needs repo secrets MODAL_TOKEN_ID and MODAL_TOKEN_SECRET.

on:
  workflow_dispatch:
    inputs:
      gpu:
        description: "GPU type (T4, L4, A10G, H100)"
        default: "T4"
      slow:
        description: "Include slow tests (GGUF via llama.cpp, ONNX)"
        type: boolean
        default: false
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

concurrency:
  group: gpu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gpu-tests:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-gpu-tests')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "modal>=1.0"
      - name: Run GPU suite on Modal
        run: |
          ARGS="--gpu ${{ inputs.gpu || 'T4' }}"
          if [ "${{ inputs.slow }}" = "true" ]; then ARGS="$ARGS --slow"; fi
          modal run scripts/modal_gpu_tests.py $ARGS
